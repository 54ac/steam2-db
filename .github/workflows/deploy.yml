name: Deploy to Cloudflare Pages
run-name: "[${{ inputs.target_env || 'stg' }}] ${{ github.event.head_commit.message || github.sha }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deployment target"
        required: true
        default: "stg"
        type: choice
        options:
          - stg
          - prod

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Determine target branch and commit metadata
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target_env }}" = "prod" ]; then
            echo "Deploying to PRODUCTION (branch: main)"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying to STAGING (branch: stg)"
            echo "branch=stg" >> "$GITHUB_OUTPUT"
            echo "env=stg" >> "$GITHUB_OUTPUT"
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/["`$\\]//g')
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=steam2-db --branch=${{ steps.target.outputs.branch }} --commit-hash=${{ steps.target.outputs.commit_hash }} --commit-message="${{ steps.target.outputs.commit_msg }}" --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Write run summary
        run: |
          echo "Deployed [${{ steps.target.outputs.env }}] ${{ steps.target.outputs.commit_msg }}" >> "$GITHUB_STEP_SUMMARY"
